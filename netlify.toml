[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Consolidate legacy Wix URLs and old spelling variants into the new structure.
[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[redirects]]
  from = "/location"
  to = "/directions"
  status = 301

[[redirects]]
  from = "/safetyandrules"
  to = "/safety-rules"
  status = 301

[[redirects]]
  from = "/reachout"
  to = "/directions"
  status = 301

[[redirects]]
  from = "/reviews"
  to = "/#reviews"
  status = 301

[[redirects]]
  from = "/jobs"
  to = "/"
  status = 301

[[redirects]]
  from = "/applynow"
  to = "/"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
